<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 - Page Not Found | Alira Digital</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg?v=2">
  <link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
  <link rel="icon" href="/assets/img/favicon-32x32.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/img/favicon-192.png?v=2" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="/build/assets/app-BTeufEwW.css">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <script>
    // GitHub Pages Smart Redirect: if a route like /about-us is missing trailing slash, auto-redirect
    (function() {
      var path = window.location.pathname;
      if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
        window.location.replace(path + '/' + window.location.search + window.location.hash);
      }
    })();
  </script>
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#0A282D;color:#EAF4EE;font-family:var(--f-sans, sans-serif);text-align:center;padding:24px">
  <div style="max-width:540px;display:flex;flex-direction:column;align-items:center;gap:24px">
    <a href="/" aria-label="Alira Digital home">
      <img src="/assets/img/alira-pro-1-light.svg" alt="Alira Digital" width="220" height="52" style="height:44px;width:auto;display:block">
    </a>
    <span style="font-family:var(--f-mono, monospace);font-size:13px;letter-spacing:0.2em;text-transform:uppercase;color:#10B981;font-weight:600">Error 404</span>
    <h1 style="font-size:clamp(32px, 6vw, 56px);font-weight:800;letter-spacing:-0.03em;margin:0;line-height:1.1">Page not found</h1>
    <p style="font-size:16px;color:rgba(234, 244, 238, 0.7);line-height:1.6;margin:0">The page you were looking for doesn't exist, has been removed, or moved to another location.</p>
    <div style="margin-top:12px">
      <a class="btn btn--green" href="/" style="display:inline-flex;align-items:center;gap:10px;padding:12px 28px;background:#10B981;color:#0A282D;border-radius:999px;font-weight:600;text-decoration:none">
        <span>Back to Homepage</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </div>
</body>
</html>
